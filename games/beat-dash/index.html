<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0620">
<title>Beat Dash</title>
<meta name="description" content="Tap to jump. A neon cube auto-runs a course built on the beat: clear spikes, hit pads and orbs, flip gravity. Six levels, practice mode, instant retry.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hudBtns" class="hidden">
  <button id="bMute" class="ibtn" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <button id="bPause" class="ibtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
</div>
<div id="pracBtns" class="hidden">
  <button id="bCp" class="pbtn place" aria-label="Place checkpoint"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)" fill="currentColor"/></svg><span>Z</span></button>
  <button id="bCpDel" class="pbtn del" aria-label="Remove checkpoint"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>X</span></button>
</div>

<div id="title" class="screen">
  <button id="bMute3" class="ibtn titleMute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <div class="logo"><span class="l1">BEAT</span><span class="l2">DASH</span></div>
  <button id="bPlay" class="big">PLAY</button>
  <div id="titleLv" class="titleLv"></div>
  <button id="bLevels" class="mid ghost">LEVELS</button>
  <div class="hints">
    <div class="hint deskHint">Click anywhere or press Space to start. Click / Space to jump, hold to keep jumping.</div>
    <div class="hint touchHint">Tap anywhere to start. Tap to jump, hold to keep jumping.</div>
    <div class="hint rotHint">Turn your phone sideways to see further ahead.</div>
  </div>
</div>

<div id="select" class="screen hidden">
  <div class="selTop">
    <button id="bBack" class="ibtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="selTitle">SELECT LEVEL</div>
    <button id="bMute2" class="ibtn" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="carousel">
    <button id="bPrev" class="arrow" aria-label="Previous level"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="card" class="card"></div>
    <button id="bNext" class="arrow" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="dots" class="dots"></div>
  <div class="cubes"><div id="palMsg" class="palMsg"></div><div class="cubesLbl">CUBE</div><div id="pals" class="pals"></div></div>
</div>

<div id="pause" class="screen dim hidden">
  <div class="panel">
    <div class="pTitle">PAUSED</div>
    <div id="pauseInfo" class="pInfo"></div>
    <button id="bResume" class="big">RESUME</button>
    <div class="row">
      <button id="bRestart" class="mid">RESTART</button>
      <button id="bPractice" class="mid">PRACTICE</button>
    </div>
    <div class="row">
      <button id="bMenu" class="mid ghost">LEVELS</button>
      <button id="bSound" class="mid ghost">SOUND: ON</button>
    </div>
  </div>
</div>

<div id="results" class="screen dim hidden">
  <div class="panel">
    <div id="rTitle" class="rTitle">LEVEL COMPLETE!</div>
    <div id="rName" class="rName"></div>
    <div class="stats">
      <div><b id="rAtt">1</b><span>attempts</span></div>
      <div><b id="rJumps">0</b><span>jumps</span></div>
      <div><b id="rTime">0s</b><span>time</span></div>
    </div>
    <div id="rUnlock" class="rUnlock"></div>
    <button id="bRetry" class="big">RETRY</button>
    <div class="row">
      <button id="bNextLv" class="mid">NEXT LEVEL</button>
      <button id="bMenu2" class="mid ghost">LEVELS</button>
    </div>
  </div>
</div>

<noscript>Beat Dash needs JavaScript turned on.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
