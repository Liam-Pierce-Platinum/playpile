<!doctype html>
<html lang="en">
<head>
<script src="../_shared/mobile.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FREEZE RUN</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="edge"></div>
<div id="hud">
  <div id="lvl">LEVEL 1</div>
  <div id="timer">0:30</div>
  <div id="alive">ALIVE 20</div>
  <div id="track"><div id="trackFill"></div><div id="trackDot"></div><div id="trackEnd"></div></div>
  <div id="feed"></div>
</div>
<div id="banner"></div>
<div id="hint">HOLD <b>SPACE</b> / <b>TOUCH</b> TO RUN &middot; LET GO TO FREEZE &middot; A/D or drag to steer</div>
<div id="card" class="hide">
  <div id="cardTitle">SAFE!</div>
  <div id="cardStars"></div>
  <div id="cardSub"></div>
  <div class="row">
    <button id="bRetry">RETRY</button>
    <button id="bNext" class="main">NEXT</button>
  </div>
  <button id="bMenu" class="ghost">LEVELS</button>
</div>
<div id="menu" class="hide">
  <div id="logo">FREEZE<span>RUN</span></div>
  <div id="tag">Run while she looks away. Freeze when she turns.</div>
  <div id="levels"></div>
  <div id="totStars"></div>
  <button id="bPlay" class="main">PLAY</button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
