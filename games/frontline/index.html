<!doctype html>
<html lang="en">
<head>
<script src="../_shared/mobile.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FRONTLINE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none"></div>
<div id="ui"></div>
<div id="touch" style="display:none">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="t-fire">FIRE</button>
  <button class="tbtn" id="t-aim">AIM</button>
  <button class="tbtn" id="t-reload">R</button>
  <button class="tbtn" id="t-jump">JUMP</button>
  <button class="tbtn" id="t-crouch">CRCH</button>
  <button class="tbtn" id="t-nade">NADE</button>
  <button class="tbtn" id="t-swap">SWAP</button>
  <button class="tbtn" id="t-use">USE</button>
  <button class="tbtn" id="t-sprint">RUN</button>
  <button class="tbtn" id="t-pause" aria-label="Pause">II</button>
</div>
<noscript>FRONTLINE needs JavaScript.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
