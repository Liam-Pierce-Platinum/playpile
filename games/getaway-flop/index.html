<!doctype html>
<html lang="en">
<head>
<script src="../_shared/mobile.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Getaway Flop</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="pips"></div>
  <div id="track"><div id="lane"></div><div id="carmark">CAR</div></div>
</div>
<div id="weap"></div>
<div id="say"></div>
<div id="card" class="hide"></div>
<div id="touch">
  <button id="touchMenu" type="button">Menu</button>
  <div class="touch-player" aria-label="Player 1 controls">
    <button data-player="0" data-touch-action="left" aria-label="Player 1 hop left">&#9664;</button>
    <button data-player="0" data-touch-action="fire" aria-label="Player 1 fire">Bang</button>
    <button data-player="0" data-touch-action="right" aria-label="Player 1 hop right">&#9654;</button>
  </div>
  <div class="touch-player" aria-label="Player 2 controls" id="touchP2" hidden>
    <button data-player="1" data-touch-action="left" aria-label="Player 2 hop left">&#9664;</button>
    <button data-player="1" data-touch-action="fire" aria-label="Player 2 fire">Bang</button>
    <button data-player="1" data-touch-action="right" aria-label="Player 2 hop right">&#9654;</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
