<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#071522" />
    <title>Harbor Rush — PlayPile</title>
    <meta
      name="description"
      content="An original open-city arcade courier driving game. Find your route, drift the harbor, and build your fleet."
    />
    <link rel="stylesheet" href="style.css" />
    <script src="../_shared/mobile.js"></script>
  </head>
  <body>
    <canvas id="city" aria-label="Harbor Rush city driving game"></canvas>
    <div id="hud" hidden>
      <header>
        <div class="brand">
          HARBOR<span>RUSH</span><small id="district">SOUTH DOCKS</small>
        </div>
        <div class="readout">
          <small>SHIFT EARNINGS</small><strong id="bank">$0</strong>
        </div>
        <button id="pauseButton" aria-label="Pause game">Ⅱ</button>
      </header>
      <section id="dispatch">
        <small id="phase">DISPATCH / 01</small>
        <h2 id="objective">Follow the cyan route</h2>
        <p id="instructions">Slow down in the marked bay.</p>
        <div class="meter"><i id="cargo"></i></div>
        <div class="dispatchStats">
          <span id="condition">PACKAGE 100%</span><b id="distance">0 m</b>
        </div>
      </section>
      <div id="toast" role="status"></div>
      <section id="speed">
        <strong id="speedValue">0</strong><span>KM/H</span>
        <div class="boost"><i id="boostFill"></i></div>
        <small>BOOST <b>SHIFT</b></small>
      </section>
      <nav id="actions">
        <button id="jobsButton">Jobs <kbd>B</kbd></button
        ><button id="garageButton">Garage <kbd>G</kbd></button
        ><button id="soundButton" aria-label="Toggle sound effects">
          FX off
        </button>
      </nav>
      <div id="touch">
        <div>
          <button data-input="left" aria-label="Steer left">◀</button
          ><button data-input="right" aria-label="Steer right">▶</button>
        </div>
        <div>
          <button data-input="drift">DRIFT</button
          ><button data-input="brake">BRAKE<br /><small>REVERSE</small></button
          ><button data-input="throttle" class="pedal">GO</button
          ><button data-input="boost" class="nitro">BOOST</button>
        </div>
      </div>
      <div id="help">
        WASD / ARROWS drive · SPACE drift · SHIFT boost · B jobs · G garage · P
        pause
      </div>
    </div>
    <div id="overlay"><section class="panel" id="menu"></section></div>
    <script type="module" src="game.js"></script>
    <noscript>Turn on JavaScript to play Harbor Rush.</noscript>
  </body>
</html>
