<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#071522" />
    <title>Harbor Rush — PlayPile</title>
    <meta
      name="description"
      content="An original open-city arcade courier driving game. Find your route, drift the harbor, and build your fleet."
    />
    <link rel="stylesheet" href="style.css?v=20261120-touch-size" />
    <link rel="stylesheet" href="../_shared/city-art/driving-pad.css?v=20261120-touch-size" />
    <script type="importmap">
      {"imports":{
        "../apex/vendor/three.module.js":"../_deck/three.module.js",
        "./model.js":"./model.js?v=20261120-controls",
        "./render3d.js":"./render3d.js?v=20261120-hud",
        "./fallback.js":"./fallback.js?v=20261120-hud"
      }}
    </script>
    <script src="../_shared/mobile.js"></script>
  </head>
  <body>
    <canvas id="city" tabindex="0" aria-label="Harbor Rush city driving game"></canvas>
    <div id="hud" hidden>
      <header>
        <section id="dispatch" data-drive-readout aria-label="Current route">
          <div class="route-line"><strong id="objective">Free drive</strong><span id="distance" hidden></span></div>
          <div id="routeNote" hidden></div>
          <div id="toast" role="status" hidden></div>
        </section>
        <div id="speed" data-drive-readout aria-label="Speed and boost">
          <strong id="speedValue">0</strong><span>km/h</span>
          <div class="boost" title="Boost charge"><i id="boostFill"></i></div>
        </div>
        <button id="pauseButton" aria-haspopup="dialog" aria-label="Pause game and open menu">Menu</button>
      </header>
      <div id="touch" class="driving-pad">
        <div>
          <button data-input="left" aria-label="Steer left"><span class="arrow" aria-hidden="true"></span></button
          ><button data-input="right" aria-label="Steer right"><span class="arrow right" aria-hidden="true"></span></button>
        </div>
        <div>
          <button data-input="drift">DRIFT</button
          ><button data-input="brake">BRAKE<br /><small>REVERSE</small></button
          ><button data-input="throttle" class="pedal accelerator">GO</button
          ><button data-input="boost" class="nitro">BOOST</button>
        </div>
      </div>
    </div>
    <div id="overlay" role="dialog" aria-modal="true" aria-label="Harbor Rush">
      <section class="panel"><div id="menu"></div><div data-playpile-notices></div></section>
    </div>
    <script type="module" src="game.js?v=20261120-hud"></script>
    <noscript>Turn on JavaScript to play Harbor Rush.</noscript>
  </body>
</html>
