<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SLOPE RUSH</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="sub"><span id="best">BEST 0</span><span id="volts">◆ 0</span></div>
<div id="speed"><div id="spdw"><i id="spd"></i></div><span id="kmh"></span></div></div>
<div id="banner"></div><div id="pops"></div>
<div id="title" class="panel hide"><h1>SLOPE<br><em>RUSH</em></h1><button id="play" class="btn">PLAY</button>
<div id="tBest"></div><div id="skins"></div><p class="hint">A / D or &larr; &rarr; to steer &middot; touch left / right half &middot; M mute &middot; P pause</p></div>
<div id="over" class="panel hide"><div id="oCause"></div><div id="oScore">0</div><div id="oBest"></div><div id="oVolts"></div><div id="oNext"></div><div class="btn">TAP / SPACE TO RETRY</div></div>
<div id="pause" class="panel hide"><h2>PAUSED</h2><p class="hint">tap or P to resume</p></div>
<script type="module" src="src/main.js"></script>
</body></html>
