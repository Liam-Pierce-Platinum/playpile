<script type="module">
// /category/<name>/ - the slug is read off the PATH, the same way the game
// page reads its own. tools/deploy.mjs writes this page out once per
// category with the text already in it; locally it is filled in here.
import { GAMES, mountShell } from '/site/shell.js';
import { catOf, catSlug, categoryBody, catUrl } from '/site/pages.js';
import { introFor } from '/site/categories.js';
import { loadAds } from '/ads/ads.js';
import { friendsList, FRIENDS } from '/site/multiplayer.js';
const slug = location.pathname.split('/').filter(Boolean).pop();
// /free-multiplayer-games/ is not a catalogue category but a list across
// them (site/multiplayer.js): online games first, then same-screen ones
const friends = catUrl(FRIENDS.cat) === '/' + slug + '/';
const cat = friends ? FRIENDS.cat : [...new Set(GAMES.map(catOf))].find((c) => catSlug(c) === slug || catUrl(c) === '/' + slug + '/');
if (!cat) { location.replace('/'); throw new Error('no such category: ' + slug); }
mountShell({ active: cat });
const list = friends ? friendsList(GAMES) : GAMES.filter((g) => catOf(g) === cat);
const box = document.getElementById('catpage');
if (!box.querySelector('h1')) {
  box.innerHTML = categoryBody(cat, list, friends ? FRIENDS.intro : introFor(cat));
  document.title = cat + ' games — play free in your browser — PLAYPILE';
}
loadAds();
</script>
